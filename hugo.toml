baseURL = "https://comanadrianioan.github.io/personal-site/"
locale = "en-us"
title = "Adrian-Ioan Coman"
disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[params]
  contentTypeName = "writing"
  showMenuItems = 2
  readOtherPosts = "read other posts"
  subtitle = "Senior Engineer @ CrowdStrike · GenAI · Java · Cloud-native"

  [params.logo]
    logoText = "adrian@coman:~$"

[params.links]
  github = "https://github.com/comanadrianioan"
  # linkedin = "https://www.linkedin.com/in/<slug>/"   # left out for v1

[menus]
  [[menus.main]]
    name = "about"
    pageRef = "/about"
    weight = 1
  [[menus.main]]
    name = "writing"
    pageRef = "/writing"
    weight = 2
