baseURL = "https://comanadrianioan.github.io/personal-site/"
locale = "en-us"
title = "Adrian-Ioan Coman"
disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[params]
  contentTypeName = "writing"
  fullWidthTheme = true
  skills = ["genai", "java", "go", "spring-boot", "microservices"]
  readOtherPosts = "read other posts"
  dateFormat = "Jan 2, 2006"
  subtitle = "Senior Engineer @ CrowdStrike · GenAI · Speaker · Runs on coffee"

[params.links]
  github = "https://github.com/comanadrianioan"
  linkedin = "https://www.linkedin.com/in/adrian-ioan-coman/"

[menus]
  [[menus.main]]
    name = "about"
    pageRef = "/about"
    weight = 1
  [[menus.main]]
    name = "writing"
    pageRef = "/writing"
    weight = 2

[markup.highlight]
  noClasses = false
