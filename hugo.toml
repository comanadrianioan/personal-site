baseURL = "https://comanadrian.ro/"
locale = "en-us"
# The site name Google shows ("Adrian Coman", the form people search for); the home page heading
# shows the full name from content/_index.md.
title = "Adrian Coman"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
# Last-modified dates (sitemap, structured data) come from git; CI checks out the full history for it.
enableGitInfo = true

# Agents: every page also has a Markdown copy (Hugo's built-in "markdown" format, at index.md),
# and the home page an /llms.txt index of them.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["html", "rss", "markdown", "llms"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[params]
  contentTypeName = "writing"
  fullWidthTheme = true
  readOtherPosts = "read other posts"
  dateFormat = "Jan 2, 2006"
  # The home page shows the first part as the role; the parts joined with " · " are the site description.
  tagline = ["Senior Engineer @ CrowdStrike", "GenAI", "Speaker", "Runs on coffee"]

# Search: the other spellings of the name go into the structured data.
# No employer here: the company stays out of the structured data.
[params.seo]
  homeTitle = "Adrian Coman (Adrian-Ioan Coman), GenAI & Go engineer"
  alternateNames = ["Adrian-Ioan Coman", "Adrian Ioan Coman", "Coman Adrian", "Coman Adrian-Ioan"]
  jobTitle = "Senior Engineer"
  locality = "Bucharest"
  country = "RO"

[params.links]
  github = "https://github.com/comanadrianioan"
  linkedin = "https://www.linkedin.com/in/adrian-ioan-coman/"

[menus]
  [[menus.main]]
    name = "about"
    pageRef = "/about"
    weight = 1
  [[menus.main]]
    name = "writing"
    pageRef = "/writing"
    weight = 2

[markup.highlight]
  noClasses = false
