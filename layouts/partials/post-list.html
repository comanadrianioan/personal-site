{{/* Posts, newest first: title and date. Takes a page collection. */}}
<ul class="ls post-list">
  {{ range . }}
    <li><a class="post-row" href="{{ .RelPermalink }}"><span class="post-row-title">{{ .Title }}</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></a></li>
  {{ end }}
</ul>
