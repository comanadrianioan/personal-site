{{/* Overrides the theme header: a sticky, blurred top bar with a terminal-style brand. */}}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-nav">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}"><span class="brand-tilde">~/</span>adrian-coman<span class="caret" aria-hidden="true"></span></a>
    <nav class="nav-links" aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-icon" href="{{ site.Params.links.linkedin }}" aria-label="LinkedIn">{{ partial "icon-linkedin.html" . }}</a>
      <a class="nav-icon" href="{{ site.Params.links.github }}" aria-label="GitHub">{{ partial "icon-github.html" . }}</a>
    </nav>
  </div>
</header>
