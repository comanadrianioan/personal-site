{{/* Overrides the theme header: a sticky top bar with a shell-path brand. */}}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-nav">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}"><span class="brand-tilde">~/</span>adrian-coman</a>
    <nav class="nav-links" aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-icon" href="{{ site.Params.links.linkedin }}" aria-label="LinkedIn">{{ partial "icon-linkedin.html" . }}</a>
      <a class="nav-icon" href="{{ site.Params.links.github }}" aria-label="GitHub">{{ partial "icon-github.html" . }}</a>
      <button class="nav-icon theme-toggle" type="button" data-mode="system" hidden>
        <svg class="i-system" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </nav>
  </div>
</header>
