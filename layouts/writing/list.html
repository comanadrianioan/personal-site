{{/* /writing/: post list, or a short note while there are no posts. */}}
{{ define "main" }}
  <section class="wrap page" id="main">
    <h1 class="page-title">Writing</h1>
    <p class="page-sub">Notes on generative AI, Go and cloud infrastructure.</p>
    {{ with .RegularPages }}
      {{ partial "post-list.html" . }}
    {{ else }}
      <p class="empty">No posts yet. The first one is on its way.</p>
    {{ end }}
  </section>
{{ end }}
