{{/* Theme v4.2.6 404.html, restyled as a shell error; the home link keeps the /personal-site/ sub-path. */}}
{{ define "main" }}
  <section class="wrap page" id="main">
    <h1 class="page-title">Page not found</h1>
    <p class="shell-error">cd: no such file or directory</p>
    <p class="page-sub">This page doesn't exist, or it has moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="{{ site.Home.Permalink }}">Go to the home page</a>
      <a class="btn" href="{{ "writing/" | relURL }}">Read the writing</a>
    </div>
  </section>
{{ end }}
