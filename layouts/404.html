{{/* Theme v4.2.6 404.html, restyled as a shell error; "back to home" keeps the /personal-site/ sub-path. */}}
{{ define "main" }}
  <section class="wrap page" id="main">
    <p class="prompt">$ cd {{ "this-page" }}</p>
    <h1 class="page-title">404</h1>
    <p class="page-sub">cd: no such file or directory — this page doesn't exist (anymore).</p>
    <div class="actions">
      <a class="btn btn-primary" href="{{ site.Home.Permalink }}">Back to home page <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="{{ "writing/" | relURL }}">Writing</a>
    </div>
  </section>
{{ end }}
